name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.21'
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-py${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked --python python
      - name: Run synthetic tests
        run: >-
          uv run --locked python -m unittest discover
          -s tests -t . -p 'test_*.py' -v
      - name: Check CLI entry points
        run: |
          uv run --locked spacekeeper --help
          uv run --locked python -m spacekeeper --version

  distributions:
    name: Build and install distributions
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.21'
          enable-cache: true
          cache-suffix: distributions
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Verify distribution contents
        run: python scripts/check-distributions.py
      - name: Install distributions in fresh environments
        run: |
          uv venv "$RUNNER_TEMP/spacekeeper-wheel" --python python
          uv pip install --python "$RUNNER_TEMP/spacekeeper-wheel/bin/python" dist/*.whl
          uv venv "$RUNNER_TEMP/spacekeeper-sdist" --python python
          uv pip install --python "$RUNNER_TEMP/spacekeeper-sdist/bin/python" dist/*.tar.gz
      - name: Check installed commands outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          for distribution in wheel sdist; do
            package_env="$RUNNER_TEMP/spacekeeper-$distribution"
            "$package_env/bin/spacekeeper" --version
            "$package_env/bin/spacekeeper" --help
            "$package_env/bin/spacekeeper" \
              --state-dir "$package_env/state" \
              --config-dir "$package_env/config" list
            test ! -e "$package_env/state"
          done
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

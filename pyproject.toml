[project]
name = "spacekeeper"
version = "0.1.0"
description = "Capture and restore macOS fullscreen window arrangements through yabai."
authors = [{ name = "Adriean Khisbe" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click (>=8.5.0,<9.0.0)"]

[project.urls]
Repository = "https://github.com/omni-tools/spacekeeper"

[project.scripts]
spacekeeper = "spacekeeper.cli:main"

[tool.poetry]
packages = [{ include = "spacekeeper", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "spacekeeper"
version = "0.1.0"
description = "Capture and restore macOS fullscreen window arrangements through yabai."
authors = [{ name = "Adriean Khisbe" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click>=8.5.0,<9.0.0"]

[project.urls]
Repository = "https://github.com/omni-tools/spacekeeper"

[project.scripts]
spacekeeper = "spacekeeper.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**"]
